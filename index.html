 ind=function(v){return v.trim()?v.replace(/\n/g,'\n        '):'(belum diisi)'};
 $$('#m [data-x]').forEach(function(n){var t=n.dataset.x;
  if(t==='head')L.push('','=== '+n.textContent+' ===','');
  else if(t==='sub')L.push('',n.textContent);
  else if(t==='qa')L.push($('.qt',n).textContent.trim(),'   Jawaban: '+ind(val($('.ans',n))),'');
  else if(t==='members')S.am.forEach(function(a,i){L.push('Anggota '+(i+2)+': '+(a.n||'-'))});
  else if(t==='check'){L.push(n.dataset.title+':');$$('label',n).forEach(function(l,i){L.push('  ['+(S.src[i]?'x':' ')+'] '+l.textContent.trim())});L.push('')}
  else if(t==='table'){L.push(n.dataset.title+':');$$('tbody tr',n).forEach(function(tr,i){L.push('  Baris '+(i+1)+':');$$('td',tr).forEach(function(td){var lb=td.dataset.label;if(!lb||lb==='No.')return;var e=$('.ans',td);L.push('    - '+lb+': '+(e?ind(val(e)):td.textContent.trim()))})});L.push('')}});
 return L.join('\r\n')}
function dl(){var b=new Blob(['\ufeff'+txt()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fb()+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
var IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function pr(){document.title=fb();requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(function(){try{window.print()}catch(e){guide()}},80)})})}
function guide(){modal('Panduan Cetak di iPhone / iPad','<ol><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas) di Safari, lalu pilih <b>Cetak</b>.</li><li>Di pratinjau cetak, renggangkan dua jari (pinch-out) pada halaman agar berubah menjadi PDF.</li><li>Ketuk <b>Bagikan</b> lagi → <b>Simpan ke Berkas</b>.</li></ol><p class="small">Jika dialog tidak muncul, gunakan Safari (bukan tampilan dalam aplikasi lain) atau unduh jawaban lewat tombol .txt.</p>',[['Tutup'],['Coba Cetak Sekarang',pr,'p']])}
window.addEventListener('beforeprint',function(){document.title=fb()});window.addEventListener('afterprint',function(){document.title=T0});
/* ---------- event ---------- */
document.addEventListener('input',function(e){var el=e.target;if(!el.classList||!el.classList.contains('ans'))return;if(el.textContent===''&&el.innerHTML!=='')el.innerHTML='';sync(el);upd()});
document.addEventListener('change',function(e){var c=e.target;if(c.matches&&c.matches('.chk input')){S.src[c.dataset.i]=c.checked?1:0;upd()}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-del]');
 if(b){var g=b.dataset.del,i=+b.dataset.i,has=g==='am'?(S.am[i].n||''):CC.map(function(c){return S.c1[i][c[0]]||''}).join('');
  var go=function(){S[g].splice(i,1);g==='am'?rA():rC();upd()};has.trim()?ask('Hapus baris ini?','Isian pada baris ini akan hilang.',go,'Hapus'):go();return}
 b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
 if(a==='addA'){S.am.push({n:''});rA(S.am.length-1);upd()}
 else if(a==='addC'){S.c1.push({});rC(S.c1.length-1);upd()}
 else if(a==='txt')dl();
 else if(a==='pdf')IOS?guide():pr();
 else if(a==='reset')ask('Reset seluruh isian?','Semua jawaban, anggota, dan baris tabel akan dikosongkan, dan data tersimpan di browser dihapus. Tindakan ini tidak dapat dibatalkan.',function(){try{localStorage.removeItem(KEY)}catch(x){}S=fresh();dirty=false;fill();$('#sv').textContent='Formulir dikosongkan'},'Ya, Reset')});
})();
